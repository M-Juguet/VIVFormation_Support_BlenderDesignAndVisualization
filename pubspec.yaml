name: viv_support_blender_design_viz
description: "Support de formation VIV Formation PRC02 : Design & visualisation temps réel avec Blender."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.13
  shadcn_ui: ^0.54.0
  shared_preferences: ^2.5.5
  window_manager: ^0.5.1
  go_router: ^14.8.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  ffi: ^2.2.0
  package_info_plus: ^10.1.0
  flutter_markdown: ^0.7.7+1
  markdown: ^7.3.1
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/

  # Polices de la charte VIV Formation. Il n'existe pas de gras droit :
  # la hiérarchie passe par la taille, la couleur et l'italique gras.
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Light.ttf
          weight: 300
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/NotoSans-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Noto Sans Mono
      fonts:
        - asset: assets/fonts/NotoSansMono-Regular.ttf
          weight: 400
